# V2X-ViT "classique" -- ablation baseline for the KAN-ViT speed/VRAM
# comparison. Line-for-line identical to
# point_pillar_intermediate_fusion_kanvit_full.yaml (feature_stride,
# cav_lidar_range, max_cav, seed/wild_setting, lr, score_threshold,
# lr_scheduler, max_num=300, batch_size=1) except:
#   - model.core_method: point_pillar_transformer (not
#     point_pillar_transformer_kanvit) -- same PillarVFE -> scatter ->
#     BEV backbone -> V2X-ViT fusion -> heads pipeline, verified
#     line-for-line identical to point_pillar_transformer_kanvit.py
#     except which fusion_net class it builds.
#   - transformer.encoder.feed_forward: plain 2-layer MLP
#     (nn.Linear -> GELU -> Dropout -> nn.Linear -> Dropout, see
#     base_transformer.py::FeedForward) instead of KANFeedForward.
#     kan_degree/kan_pool_size dropped since FeedForward doesn't read
#     them (V2XTEncoder only reads mlp_dim/dropout from this block).
# Day 5 real-training config, wired into kaggle/train_v2xvit_classic/ via
# scripts/kaggle_train_entry.py --model v2xvit_classic (5 epochs, full
# 34-sequence dataset) -- same as AttFuse/KAN-ViT's Day 5 training setup.
name: point_pillar_v2xvit_classic
root_dir: "C:/Users/vPro/Projects/kan-vit-pfe/data/opencood_format_full/train"
validate_dir: "C:/Users/vPro/Projects/kan-vit-pfe/data/opencood_format_full/validate"

wild_setting:
  async: false
  async_mode: 'sim'
  async_overhead: 100
  seed: 25
  loc_err: false
  xyz_std: 0.2
  ryp_std: 0.2
  data_size: 1.06 # Mb!!
  transmission_speed: 27 # Mbps!!
  backbone_delay: 10 # ms

yaml_parser: "load_point_pillar_params"
train_params:
  batch_size: &batch_size 1  # kept in sync with the KAN-ViT config, which OOM'd at batch_size=2 on a T4 16GB -- see that file's comment
  epoches: 5
  eval_freq: 1
  save_freq: 1
  max_cav: &max_cav 5

fusion:
  core_method: 'IntermediateFusionDataset' # LateFusionDataset, EarlyFusionDataset, IntermediateFusionDataset supported
  args:
    cur_ego_pose_flag: True

# preprocess-related
preprocess:
  # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  # lidar range for each individual cav.
  cav_lidar_range: &cav_lidar [-140.8, -38.4, -3, 140.8, 38.4, 1]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [ 'x' ]

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [ -0.78539816, 0.78539816 ]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [ 0.95, 1.05 ]

# anchor box related
postprocess:
  core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    feature_stride: 4
    num: &achor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl' # hwl or lwh
  max_num: 300 # kept in sync with the AttFuse/KAN-ViT Day 5 configs so padding size doesn't bias the comparison.
  nms_thresh: 0.15

# model related
model:
  core_method: point_pillar_transformer
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *achor_num
    max_cav: *max_cav
    compression: 0 # compression rate
    backbone_fix: false

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
    shrink_header:
      kernal_size: [3]
      stride: [2]
      padding: [1]
      dim: [256]
      input_dim: 384 # 128 * 3

    transformer:
      encoder: &encoder
        # number of fusion blocks per encoder layer
        num_blocks: 1
        # number of encoder layers
        depth: 3
        use_roi_mask: true
        use_RTE: &use_RTE true
        RTE_ratio: &RTE_ratio 2 # 2 means the dt has 100ms interval while 1 means 50 ms interval
        # agent-wise attention
        cav_att_config: &cav_att_config
          dim: 256
          use_hetero: true
          use_RTE: *use_RTE
          RTE_ratio: *RTE_ratio
          heads: 8
          dim_head: 32
          dropout: 0.3
        # spatial-wise attention
        pwindow_att_config: &pwindow_att_config
          dim: 256
          heads: [16, 8, 4]
          dim_head: [16, 32, 64]
          dropout: 0.3
          window_size: [4, 8, 16]
          relative_pos_embedding: true
          fusion_method: 'split_attn'
        # feedforward condition -- classic V2X-ViT: plain 2-layer MLP
        # (base_transformer.py::FeedForward), not KANFeedForward.
        feed_forward: &feed_forward
          mlp_dim: 256
          dropout: 0.3
        sttf: &sttf
          voxel_size: *voxel_size
          downsample_rate: 4

      # add decoder later

loss:
  core_method: point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0

optimizer:
  core_method: Adam
  lr: 0.001
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep #step, multistep and Exponential support
  gamma: 0.1
  step_size: [10, 15] # matches the KAN-ViT config's rationale: epoches=5, neither milestone triggers within this run.
